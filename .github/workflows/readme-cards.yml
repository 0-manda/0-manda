name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar card de stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=0-manda&show_icons=true&hide_border=true&bg_color=00000000&title_color=A86FBF&text_color=9A7FA8&icon_color=C47BAA
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=0-manda&layout=compact&hide_border=true&bg_color=00000000&title_color=A86FBF&text_color=9A7FA8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar os cards no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
